name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      # Editor UI (GTK/Relm4) is not exercised in CI yet; keep the in-process
      # nextguide-gde link covered without requiring libgtk.
      - name: Editor helpers (no GTK)
        run: cargo test -p nextguide --no-default-features

      - name: Structural check (ImportSample)
        run: cargo run -p nextguide-cli --quiet -- check data/ImportSample.gde

      - name: Byte-stable check (owned golden)
        run: cargo run -p nextguide-cli --quiet -- check --byte-stable data/canonical-golden.gde
